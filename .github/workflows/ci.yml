name: Frontend CI
on:
  push:
    branches: [production-ready-final, batch2-frontend, main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit
      - run: npm run test:e2e
      - run: npm run test:responsive
  image:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOCKER_BUILDKIT: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Build the production image without publishing
        run: |
          docker build --file Dockerfile --build-arg API_URL=http://api-gateway:8080 --build-arg NEXT_PUBLIC_WS_URL=https://ci.example.invalid/ws --tag "project1-validation/frontend:$GITHUB_SHA" .
          test "$(docker image inspect --format '{{.Config.User}}' "project1-validation/frontend:$GITHUB_SHA")" = 'node'
      - name: Check the standalone container health endpoint
        shell: bash
        run: |
          docker run --detach --name frontend-ci "project1-validation/frontend:$GITHUB_SHA"
          for attempt in {1..30}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' frontend-ci)
            if [ "$status" = healthy ]; then
              docker exec frontend-ci node -e "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
              exit 0
            fi
            [ "$status" != unhealthy ] || break
            sleep 2
          done
          docker logs frontend-ci
          exit 1
      - name: Remove the disposable CI container
        if: always()
        run: docker rm --force frontend-ci || true
